[project]
name = "speXtra"
version = "0.44.0b0.dev0"
description = "Tool to manage and manipulate astronomical spectra."
license = {text = "MIT"}
authors = [
    {name = "Miguel Verdugo", email = "mverduol@gmail.com"}
]
maintainers = [
    { name = "Kieran Leschinski", email = "kieran.leschinski@unive.ac.at" },
    { name = "Hugo Buddelmeijer", email = "hugo@buddelmeijer.nl" },
    { name = "Fabian Haberhauer", email = "fabian.haberhauer@univie.ac.at" },
]
readme = "README.md"
keywords = [ "astronomy" ]
dynamic = [ "classifiers" ]
requires-python = ">=3.12,<3.15"
dependencies = [
    "numpy (>=2.2.6,<3.0.0)",
    "astropy (>=7.0.2,<9.0.0)",

    "synphot (>=1.7.0,<2.0.0)",

    "pyyaml (>=6.0.3,<7.0.0)",
    "pooch (>=1.9.0,<2.0.0)",
    "tqdm (>=4.69.0,<5.0.0)",
    "more-itertools (>=10.8.0,<11.0.0)",

    "astar-utils (>=0.7.0,<1.0)"
]

[project.urls]
Repository = "https://github.com/AstarVienna/speXtra"
Documentation = "https://spextra.readthedocs.io/en/stable/"
"Bug Tracker" = "https://github.com/AstarVienna/speXtra/issues"
Changelog = "https://github.com/AstarVienna/speXtra/blob/main/CHANGELOG.md"


[tool.poetry]
classifiers = [
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Astronomy",
]

[tool.poetry.group.test.dependencies]
pytest = "^9.1.1"
pytest-cov = "^7.1.0"
matplotlib = "^3.11.1"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
sphinx = "^9.1.0"
sphinx-book-theme = "^1.4.0"
sphinx-copybutton = ">=0.5.2,<1.0"
sphinxcontrib-mermaid = "^2.1.0"
sphinxcontrib-apidoc = ">=0.6.0,<1.0"
myst-nb = "^1.4.0"
numpydoc = "^1.6.0"
matplotlib = "^3.11.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
addopts = "--strict-markers"
markers = [
    "webtest: marks tests as requiring network (deselect with '-m \"not webtest\"')",
]
filterwarnings = [
    "error",
    # Should certainly be fixed:

    # https://github.com/AstarVienna/speXtra/issues/61
    "ignore:The 'name plus file extension' property*:FutureWarning",

    # Should probably be fixed:
    "default:unclosed file <_io.BufferedReader name=:ResourceWarning",

    # Internal deprecation warning; the function should be tested as long
    # as it is in the codebase.
    "ignore:The download_file function is deprecated and will be removed in v1.0. Please use retriever.fetch instead.:FutureWarning",
    "ignore:Any extinction functionality*:FutureWarning",
]

[tool.coverage.report]
omit = ["spextra/tests/*"]
